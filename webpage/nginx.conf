server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The page loads nothing from other origins, so the policy can be strict.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
